    <script>
        function generateQuestions() {
            const jobTitle = document.getElementById('interviewJobTitle').value;
            const company = document.getElementById('interviewCompany').value;
            const level = document.getElementById('interviewLevel').value;
            
            if (!jobTitle) {
                alert('Please enter a job title.');
                return;
            }
            
            // Show questions section
            document.getElementById('questionsSection').classList.remove('d-none');
            
            // Show system design questions if selected
            const systemDesignChecked = document.getElementById('systemDesign').checked;
            if (systemDesignChecked) {
                document.getElementById('systemDesignQuestions').classList.remove('d-none');
            }
            
            // Scroll to questions
            document.getElementById('questionsSection').scrollIntoView({ behavior: 'smooth' });
        }

        function showAnswer(button) {
            const answerContent = button.closest('.question-item').querySelector('.answer-content');
            const isVisible = !answerContent.classList.contains('d-none');
            
            if (isVisible) {
                answerContent.classList.add('d-none');
                button.innerHTML = '<i class="fas fa-eye me-1"></i>Show Answer';
            } else {
                answerContent.classList.remove('d-none');
                button.innerHTML = '<i class="fas fa-eye-slash me-1"></i>Hide Answer';
            }
        }

        function markAsPracticed(button) {
            const questionItem = button.closest('.question-item');
            questionItem.classList.add('practiced');
            button.innerHTML = '<i class="fas fa-check me-1"></i>Practiced';
            button.classList.remove('btn-outline-success');
            button.classList.add('btn-success');
            
            // Update progress
            updateProgress();
        }

        function updateProgress() {
            const totalQuestions = document.querySelectorAll('.question-item').length;
            const practicedQuestions = document.querySelectorAll('.question-item.practiced').length;
            const progressPercentage = Math.round((practicedQuestions / totalQuestions) * 100);
            
            // Update progress bars
            const progressBars = document.querySelectorAll('.progress-bar');
            progressBars.forEach(bar => {
                bar.style.width = progressPercentage + '%';
            });
            
            // Update badges
            const badges = document.querySelectorAll('.badge');
            badges.forEach(badge => {
                if (badge.textContent.includes('/')) {
                    badge.textContent = practicedQuestions + '/' + totalQuestions;
                } else if (badge.textContent.includes('%')) {
                    badge.textContent = progressPercentage + '%';
                }
            });
        }

        function regenerateQuestions() {
            alert('Generating new set of interview questions...');
            // In a real application, this would call an API to generate new questions
        }

        function startPractice() {
            alert('Starting practice mode... This would open a mock interview session.');
            // In a real application, this would start an interactive practice session
        }

        // Auto-save form data
        document.addEventListener('DOMContentLoaded', function() {
            const inputs = document.querySelectorAll('input, select');
            inputs.forEach(input => {
                input.addEventListener('change', function() {
                    localStorage.setItem('interview_' + this.id, this.value);
                });
                
                // Load saved data
                const savedValue = localStorage.getItem('interview_' + input.id);
                if (savedValue) {
                    input.value = savedValue;
                }
            });
        });
    </script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule Interview</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome (icons) -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <!-- Flatpickr (calendar) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

  <style>
    body {
      background-color: #f9fafb;
      padding: 40px;
    }
  </style>
</head>
<body>

  <!-- Button to open modal -->
  <button class="btn btn-primary" onclick="scheduleInterview()">
    <i class="fas fa-plus me-2"></i>Schedule New Interview
  </button>

  <!-- Schedule Interview Modal -->
  <div class="modal fade" id="scheduleModal" tabindex="-1" aria-labelledby="scheduleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="scheduleModalLabel">
            <i class="fas fa-calendar-plus me-2"></i>Schedule New Interview
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="scheduleForm">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="candidateName" class="form-label">Candidate Name *</label>
                <input type="text" class="form-control" id="candidateName" required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="position" class="form-label">Position *</label>
                <input type="text" class="form-control" id="position" required>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="interviewer" class="form-label">Interviewer *</label>
                <select class="form-select" id="interviewer" required>
                  <option value="">Select Interviewer</option>
                  <option>Alex Smith</option>
                  <option>Lisa Wang</option>
                  <option>John Doe</option>
                  <option>Sarah Johnson</option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label for="interviewType" class="form-label">Interview Type *</label>
                <select class="form-select" id="interviewType" required>
                  <option value="">Select Type</option>
                  <option>Technical</option>
                  <option>Behavioral</option>
                  <option>HR</option>
                  <option>Final</option>
                </select>
              </div>
            </div>

            <!-- Date and Time -->
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="interviewDate" class="form-label">Date *</label>
                <div class="input-group">
                  <input type="text" class="form-control" id="interviewDate" placeholder="Select date" required>
                  <button class="btn btn-outline-secondary" type="button" onclick="openDatePicker()">
                    <i class="fas fa-calendar-alt"></i>
                  </button>
                </div>
                <small class="form-text text-muted">Select interview date</small>
                <div class="mt-2">
                  <button type="button" class="btn btn-sm btn-outline-primary me-2" onclick="setTodayDate()">Today</button>
                  <button type="button" class="btn btn-sm btn-outline-primary me-2" onclick="setTomorrowDate()">Tomorrow</button>
                  <button type="button" class="btn btn-sm btn-outline-primary" onclick="setNextWeekDate()">Next Week</button>
                </div>
              </div>

              <div class="col-md-6 mb-3">
                <label for="interviewTime" class="form-label">Time *</label>
                <div class="input-group">
                  <input type="time" class="form-control" id="interviewTime" required>
                  <button class="btn btn-outline-secondary" type="button" onclick="openTimePicker()">
                    <i class="fas fa-clock"></i>
                  </button>
                </div>
                <small class="form-text text-muted">Select interview time</small>
                <div class="mt-2">
                  <button type="button" class="btn btn-sm btn-outline-primary me-2" onclick="setNextHour()">Next Hour</button>
                  <button type="button" class="btn btn-sm btn-outline-primary me-2" onclick="setQuickTime(9)">9:00 AM</button>
                  <button type="button" class="btn btn-sm btn-outline-primary me-2" onclick="setQuickTime(14)">2:00 PM</button>
                  <button type="button" class="btn btn-sm btn-outline-primary" onclick="setQuickTime(16)">4:00 PM</button>
                </div>
                <div id="endTimeDisplay" class="text-muted small mt-1"></div>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="duration" class="form-label">Duration</label>
                <select class="form-select" id="duration">
                  <option value="30">30 minutes</option>
                  <option value="45">45 minutes</option>
                  <option value="60" selected>1 hour</option>
                  <option value="90">1.5 hours</option>
                  <option value="120">2 hours</option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label for="timezone" class="form-label">Timezone</label>
                <select class="form-select" id="timezone">
                  <option>UTC-8</option>
                  <option>UTC-7</option>
                  <option>UTC-6</option>
                  <option selected>UTC-5</option>
                  <option>UTC+0</option>
                  <option>UTC+1</option>
                </select>
              </div>
            </div>

            <div class="mb-3">
              <label for="interviewNotes" class="form-label">Notes</label>
              <textarea class="form-control" id="interviewNotes" rows="3"></textarea>
            </div>
            <div class="mb-3">
              <label for="meetingLink" class="form-label">Meeting Link</label>
              <input type="url" class="form-control" id="meetingLink" placeholder="https://meet.google.com/...">
            </div>
          </form>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" onclick="saveInterviewSchedule()">
            <i class="fas fa-save me-2"></i>Schedule Interview
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap + Flatpickr JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

  <script>
    // Initialize Modal
    function scheduleInterview() {
      const modal = new bootstrap.Modal(document.getElementById('scheduleModal'));
      modal.show();
    }

    // Initialize Flatpickr Date Picker
    document.addEventListener("DOMContentLoaded", function () {
      flatpickr("#interviewDate", {
        minDate: "today",
        dateFormat: "Y-m-d",
      });
    });

    // Open calendar programmatically
    function openDatePicker() {
      const picker = document.querySelector("#interviewDate")._flatpickr;
      picker.open();
    }

    function openTimePicker() {
      document.getElementById('interviewTime').focus();
    }

    // Quick date options
    function setTodayDate() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('interviewDate').value = today;
    }

    function setTomorrowDate() {
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      document.getElementById('interviewDate').value = tomorrow.toISOString().split('T')[0];
    }

    function setNextWeekDate() {
      const nextWeek = new Date();
      nextWeek.setDate(nextWeek.getDate() + 7);
      document.getElementById('interviewDate').value = nextWeek.toISOString().split('T')[0];
    }

    // Quick time options
    function setNextHour() {
      const now = new Date();
      now.setHours(now.getHours() + 1);
      const timeStr = now.toTimeString().slice(0, 5);
      document.getElementById('interviewTime').value = timeStr;
      calculateEndTime();
    }

    function setQuickTime(hours) {
      const timeStr = hours.toString().padStart(2, '0') + ':00';
      document.getElementById('interviewTime').value = timeStr;
      calculateEndTime();
    }

    // Calculate end time
    function calculateEndTime() {
      const startTime = document.getElementById('interviewTime').value;
      const duration = parseInt(document.getElementById('duration').value);
      if (!startTime) return;

      const [hours, minutes] = startTime.split(':').map(Number);
      const endMinutes = hours * 60 + minutes + duration;
      const endH = Math.floor(endMinutes / 60) % 24;
      const endM = endMinutes % 60;
      document.getElementById('endTimeDisplay').textContent = `Ends at: ${endH.toString().padStart(2, '0')}:${endM.toString().padStart(2, '0')}`;
    }

    // Save interview
    function saveInterviewSchedule() {
      const candidateName = document.getElementById('candidateName').value;
      const position = document.getElementById('position').value;
      const interviewer = document.getElementById('interviewer').value;
      const date = document.getElementById('interviewDate').value;
      const time = document.getElementById('interviewTime').value;

      if (!candidateName || !position || !interviewer || !date || !time) {
        alert("Please fill all required fields.");
        return;
      }

      alert(`✅ Interview scheduled successfully!\nCandidate: ${candidateName}\nPosition: ${position}\nInterviewer: ${interviewer}\nDate: ${date}\nTime: ${time}`);

      const modal = bootstrap.Modal.getInstance(document.getElementById('scheduleModal'));
      modal.hide();
    }
  </script>
</body>
</html>

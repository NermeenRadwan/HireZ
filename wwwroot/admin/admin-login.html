<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - HireZ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link href="admin-style.css" rel="stylesheet">
</head>
<body class="admin-auth-body">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">
                <i class="fas fa-users me-2"></i>HireZ Admin
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="../index.html">
                    <i class="fas fa-arrow-left me-1"></i>Back to Main Site
                </a>
            </div>
        </div>
    </nav>

    <!-- Admin Login Form -->
    <div class="container">
        <div class="row justify-content-center min-vh-100 align-items-center">
            <div class="col-md-6 col-lg-4">
                <div class="admin-auth-card">
                    <div class="text-center mb-4">
                        <div class="admin-icon">
                            <i class="fas fa-shield-alt"></i>
                        </div>
                        <h2 class="fw-bold mb-2">Admin Access</h2>
                        <p class="text-muted">Enter your admin credentials to access the control panel</p>
                    </div>

                    <form id="adminLoginForm">
                        <div class="mb-3">
                            <label for="adminEmail" class="form-label">Admin Email</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-envelope"></i>
                                </span>
                                <input type="email" class="form-control" id="adminEmail" name="adminEmail" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="adminPassword" class="form-label">Admin Password</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-lock"></i>
                                </span>
                                <input type="password" class="form-control" id="adminPassword" name="adminPassword" required>
                                <button class="btn btn-outline-secondary" type="button" id="toggleAdminPassword">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="rememberAdmin">
                            <label class="form-check-label" for="rememberAdmin">
                                Remember me
                            </label>
                        </div>

                        <button type="submit" class="btn btn-danger w-100 mb-3">
                            <i class="fas fa-sign-in-alt me-2"></i>Access Admin Panel
                        </button>

                        <div class="text-center">
                            <a href="#" class="text-decoration-none">Forgot admin password?</a>
                        </div>
                    </form>

                    <hr class="my-4">
                    
                    <div class="text-center">
                        <p class="mb-0 text-muted">Need help accessing the admin panel?</p>
                        <a href="#" class="btn btn-outline-secondary w-100 mt-2">
                            <i class="fas fa-question-circle me-2"></i>Contact Support
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Alert Container -->
    <div class="alert-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/main.js"></script>
    <script src="admin-script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interviews - HireZ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <!-- ✅ This button should be OUTSIDE the modal -->
  <div class="text-end m-4">
    <button class="btn btn-primary btn-lg" data-bs-toggle="modal" data-bs-target="#scheduleModal">
      <i class="fas fa-calendar-plus me-2"></i> Schedule New Interview
    </button>
  </div>

  <!-- ✅ Schedule Interview Modal -->
  <div class="modal fade" id="scheduleModal" tabindex="-1" aria-labelledby="scheduleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="scheduleModalLabel">
            <i class="fas fa-calendar-plus me-2"></i> Schedule New Interview
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
          <form id="scheduleForm">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="candidateName" class="form-label">Candidate Name *</label>
                <input type="text" class="form-control" id="candidateName" required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="position" class="form-label">Position *</label>
                <input type="text" class="form-control" id="position" required>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="interviewer" class="form-label">Interviewer *</label>
                <select class="form-select" id="interviewer" required>
                  <option value="">Select Interviewer</option>
                  <option value="Alex Smith">Alex Smith</option>
                  <option value="Lisa Wang">Lisa Wang</option>
                  <option value="John Doe">John Doe</option>
                  <option value="Sarah Johnson">Sarah Johnson</option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label for="interviewType" class="form-label">Interview Type *</label>
                <select class="form-select" id="interviewType" required>
                  <option value="">Select Type</option>
                  <option value="Technical">Technical</option>
                  <option value="Behavioral">Behavioral</option>
                  <option value="HR">HR</option>
                  <option value="Final">Final</option>
                </select>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="interviewDate" class="form-label">Date *</label>
                <div class="input-group">
                  <input type="date" class="form-control" id="interviewDate" required>
                  <button class="btn btn-outline-secondary" type="button" onclick="openDatePicker()">
                    <i class="fas fa-calendar-alt"></i>
                  </button>
                </div>
                <small class="form-text text-muted">Select interview date</small>
                <div class="mt-2">
                  <button type="button" class="btn btn-sm btn-outline-primary me-2" onclick="setTodayDate()">Today</button>
                  <button type="button" class="btn btn-sm btn-outline-primary me-2" onclick="setTomorrowDate()">Tomorrow</button>
                  <button type="button" class="btn btn-sm btn-outline-primary" onclick="setNextWeekDate()">Next Week</button>
                </div>
              </div>

              <div class="col-md-6 mb-3">
                <label for="interviewTime" class="form-label">Time *</label>
                <div class="input-group">
                  <input type="time" class="form-control" id="interviewTime" required>
                  <button class="btn btn-outline-secondary" type="button" onclick="openTimePicker()">
                    <i class="fas fa-clock"></i>
                  </button>
                </div>
                <small class="form-text text-muted">Select interview time</small>
                <div class="mt-2">
                  <button type="button" class="btn btn-sm btn-outline-primary me-2" onclick="setNextHour()">Next Hour</button>
                  <button type="button" class="btn btn-sm btn-outline-primary me-2" onclick="setQuickTime(9)">9:00 AM</button>
                  <button type="button" class="btn btn-sm btn-outline-primary me-2" onclick="setQuickTime(14)">2:00 PM</button>
                  <button type="button" class="btn btn-sm btn-outline-primary" onclick="setQuickTime(16)">4:00 PM</button>
                </div>
                <div id="endTimeDisplay" class="text-muted small mt-1"></div>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="duration" class="form-label">Duration</label>
                <select class="form-select" id="duration">
                  <option value="30">30 minutes</option>
                  <option value="45">45 minutes</option>
                  <option value="60" selected>1 hour</option>
                  <option value="90">1.5 hours</option>
                  <option value="120">2 hours</option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label for="timezone" class="form-label">Timezone</label>
                <select class="form-select" id="timezone">
                  <option value="UTC-8">Pacific Time (UTC-8)</option>
                  <option value="UTC-7">Mountain Time (UTC-7)</option>
                  <option value="UTC-6">Central Time (UTC-6)</option>
                  <option value="UTC-5" selected>Eastern Time (UTC-5)</option>
                  <option value="UTC+0">UTC (UTC+0)</option>
                  <option value="UTC+1">Central European Time (UTC+1)</option>
                </select>
              </div>
            </div>

            <div class="mb-3">
              <label for="interviewNotes" class="form-label">Notes</label>
              <textarea class="form-control" id="interviewNotes" rows="3" placeholder="Additional notes for the interview..."></textarea>
            </div>

            <div class="mb-3">
              <label for="meetingLink" class="form-label">Meeting Link</label>
              <input type="url" class="form-control" id="meetingLink" placeholder="https://meet.google.com/...">
            </div>
          </form>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" onclick="saveInterviewSchedule()">
            <i class="fas fa-save me-2"></i> Schedule Interview
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ✅ Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Date picker & time helper functions (same as before)
    function openDatePicker() {
      const dateInput = document.getElementById('interviewDate');
      if (!dateInput) return;
      dateInput.focus();
      if (typeof dateInput.showPicker === 'function') {
        dateInput.showPicker();
      } else {
        dateInput.click();
      }
    }

    function openTimePicker() {
      const timeInput = document.getElementById('interviewTime');
      if (!timeInput) return;
      timeInput.focus();
      if (typeof timeInput.showPicker === 'function') {
        timeInput.showPicker();
      } else {
        timeInput.click();
      }
    }

    function setTodayDate() {
      document.getElementById('interviewDate').value = new Date().toISOString().split('T')[0];
    }

    function setTomorrowDate() {
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      document.getElementById('interviewDate').value = tomorrow.toISOString().split('T')[0];
    }

    function setNextWeekDate() {
      const nextWeek = new Date();
      nextWeek.setDate(nextWeek.getDate() + 7);
      document.getElementById('interviewDate').value = nextWeek.toISOString().split('T')[0];
    }

    function setNextHour() {
      const now = new Date();
      now.setHours(now.getHours() + 1);
      document.getElementById('interviewTime').value = now.toTimeString().slice(0, 5);
    }

    function setQuickTime(hours) {
      document.getElementById('interviewTime').value = `${hours.toString().padStart(2, '0')}:00`;
    }
  </script>
</body>
</html>
